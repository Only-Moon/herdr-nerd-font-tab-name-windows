name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.11"
            repeat: 5
          - os: windows-latest
            python-version: "3.12"
            repeat: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install portalocker psutil

      - name: Run tests (${{ matrix.repeat }}x on Windows)
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            for i in $(seq 1 ${{ matrix.repeat }}); do
              echo "=== Run $i/${{ matrix.repeat }} ==="
              PYTHONPATH=lib python -m unittest discover -s test -v
            done
          else
            PYTHONPATH=lib python -m unittest discover -s test -v
          fi
        shell: bash

      - name: Test CLI entrypoint
        run: |
          PYTHONPATH=lib python -m nftn.cli --help
          PYTHONPATH=lib python -m nftn.cli icon nvim
        shell: bash

      - name: Test Windows CLI wrapper (Windows only)
        if: runner.os == 'Windows'
        run: |
          bin\herdr-nerd-font-tab-name.cmd --help
          bin\herdr-nerd-font-tab-name.cmd icon nvim
        shell: cmd

      - name: Lint
        run: |
          python -m compileall -q lib
        shell: bash

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          python -c "
          import tomli
          with open('herdr-plugin.toml', 'rb') as f:
              data = tomli.load(f)
          print('Plugin ID:', data.get('id'))
          print('Version:', data.get('version'))
          print('Platforms:', data.get('platforms'))
          print('Min herdr version:', data.get('min_herdr_version'))
          "
        shell: bash

      - name: Check required fields
        run: |
          python -c "
          import tomli
          with open('herdr-plugin.toml', 'rb') as f:
              data = tomli.load(f)
          required = ['id', 'name', 'version', 'min_herdr_version', 'description', 'platforms']
          for field in required:
              assert field in data, f'Missing required field: {field}'
          assert 'windows' in data['platforms'], 'windows must be in platforms'
          print('All required fields present')
          "
        shell: bash

  publish:
    name: Publish to herdr.dev
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish plugin
        run: |
          echo "To publish to herdr.dev marketplace:"
          echo "1. Push to your GitHub fork"
          echo "2. Run: herdr plugin install YOUR_GITHUB_USER/herdr-nerd-font-tab-name"
          echo "3. Or submit PR to herdrdev/herdr-plugin-index"
        shell: bash