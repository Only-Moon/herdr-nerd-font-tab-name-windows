# cSpell:disable
# Defaults for herdr-nerd-font-tab-name.
# Override any of these in ~/.config/herdr/herdr-nerd-font-tab-name.yml
# (only the keys you want to change — the rest fall back to this file).

config:
  # Shown when nothing else matches.
  fallback-icon: "?"

  # Whether the tab's own label is kept next to the icon.
  #   auto  - drop the label when it is still herdr's auto-generated tab number,
  #           keep it when you (or herdr) gave the tab a real name
  #   true  - always keep the label
  #   false - icon only
  show-name: "auto"

  # Keep the label next to the fallback icon even when show-name is false.
  always-show-fallback-name: false

  # "left" or "right" — which side of the label the icon sits on.
  icon-position: "left"

  # Prefixed when the tab holds more than one pane. Blank disables it.
  multi-pane-icon: ""

  # Icon for labels that look like a version number (1.2.3). "null" disables.
  sem-version-icon: "null"

  # Use herdr's own agent detection (claude, codex, ...) before falling back to
  # the foreground process name.
  prefer-agent-icons: true

  # Icon for a detected agent that has no entry in the `agents:` section.
  agent-fallback-icon: "󰚩"

  # Prefer argv0 over the process name when they disagree and argv0 has an icon
  # (so `npm run dev` shows the npm icon instead of the node icon).
  use-argv0: true

  # When herdr reports no foreground process for a pane, guess from the pane's
  # terminal title before giving up and using the fallback icon.
  title-fallback: true

  # Seconds between safety-net polls. Renames are event-driven; this only
  # catches foreground changes that emit no herdr event. 0 disables polling.
  poll-interval: 2

  # Only touch tabs whose label is still herdr's auto-generated number.
  rename-auto-tabs-only: false

